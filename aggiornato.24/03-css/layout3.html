<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--<link rel="stylesheet" href="./styles/style.css">-->
    <title>Document</title>
    <style>
        body {
            display: grid;
            grid-template-columns: 1fr 3fr ;
            grid-template-rows: 1fr 1fr 5fr  1fr;
            grid-template-areas: 
            "header header"
            "nav nav"
            "aside main"
            "footer footer";
            column-gap: 10px;
            row-gap: 10px;
            
        }
        header {
            grid-area: header;
            background-color: #cf1616;  
            height: 100%;
        }
        nav {
            grid-area: nav;
            background-color: #13c431;
            
        }
        aside {
            grid-area: aside;
            background-color: #9e1010;
        }
        main {
            grid-area: main;
            background-color: #a1a5aa;
        }
        footer {
            grid-area: footer;
            background-color: #b2bd17;
            
        }
    </style>
</head>
<body>
    <header>Header</header>
    <nav>
        <ul>
            <li><a href="index.html">torna all'indice</a></li>
            
        </ul>
    </nav>
    <aside>Aside</aside>
    <main>Main</main>
    <footer>Footer</footer>
</body>
</html>
